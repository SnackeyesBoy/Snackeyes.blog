{{ define "main" }}
<section class="section">
    <header class="page-scramble-header works-page-title"><h1 data-scramble="Works" aria-label="Works"># Works</h1></header>
    <p style="opacity: 0.7; margin-bottom: 2rem;">這裡紀錄了我的研究專案。</p>

    <div class="works-grid">
        {{ range .Pages }}
        <article class="feed-item">
            <div class="feed-content">
                <span class="feed-tag">[ {{ .Params.category | default "Project" }} ]</span>
                <h3 class="feed-title">
                    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                </h3>
                <p class="feed-excerpt">{{ .Summary }}</p>
                <time class="feed-date">{{ .Date.Format "2006.01" }}</time>
            </div>
            {{ if .Params.image }}
            <img src="{{ .Params.image }}" alt="{{ .Title }}" class="feed-image">
            {{ end }}
        </article>
        {{ end }}
    </div>
</section>
{{ end }}
